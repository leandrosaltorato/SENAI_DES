<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify SESI </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2 class="logo">Spotify SESI</h2>
            <nav class="menu">
                <input type="text" id="busca" placeholder="Buscar musica..." class="search-input">
            </nav>
        </aside>
        <main class="main-content">
            <h1>Resultados da Busca</h1>
            <section id="grid-musicas" class="music-grid">

            </section>
        </main>
    </div>
    <footer class="player-bar">
        <div class="now-playing">
            <p id="track-info"> Nenhuma musica tocando</p>

        </div>
        <div class="audio-controls">
            <audio id="audio-player" controls></audio>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
