<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Locadora Filmes</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div class="bg-dark text-white d-flex justify-content-between align-items-center px-4 py-3">
        <h2 class="m-0 fw-semibold">Loja - Cadastro de Filme</h2>

        <div class="d-flex align-items-center gap-3">
            <select class="form-select">
                <option>Todos</option>
                <option>Fantasia</option>
                <option>Ação</option>
                <option>Terror</option>
            </select>

            <button class="btn btn-success fw-semibold px-3">
                + Novo Filme
            </button>
        </div>
    </div>

    <!-- TABELA -->
    <div class="px-3 mt-3">
        <table class="table table-bordered bg-white align-middle text-center">
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th>Gênero</th>
                    <th>Nome</th>
                    <th>Ano</th>
                    <th>Autor</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>
                        <img src="https://br.web.img3.acsta.net/c_310_420/medias/nmedia/18/95/59/60/20417256.jpg">
                    </td>
                    <td>Fantasia</td>
                    <td>Harry Potter</td>
                    <td>2001</td>
                    <td>J.K. Rowling</td>
                    <td>
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <img src="https://upload.wikimedia.org/wikipedia/pt/8/8f/Fast_and_Furious_Poster.jpg">
                    </td>
                    <td>Ação</td>
                    <td>Velozes e Furiosos</td>
                    <td>2001</td>
                    <td>Rob Cohen</td>
                    <td>
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <img src="https://upload.wikimedia.org/wikipedia/pt/a/ac/The_Conjuring.jpg">
                    </td>
                    <td>Terror</td>
                    <td>Invocação do Mal</td>
                    <td>2013</td>
                    <td>James Wan</td>
                    <td>
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

</body>

</html>
